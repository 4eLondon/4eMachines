[colors]
[colors]
background = #1a1000
background-alt = #4d3800
foreground = #ffb000
primary = #ffb000
secondary = #cc7000
alert = #ff8c00
disabled = #4d3800

[bar/main]
width = 100%
height = 26pt
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3pt
border-size = 0pt
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = "GohuFont 11 Nerd Font:size=10;2"
modules-left = i3
modules-center = date
modules-right = memory cpu
cursor-click = pointer
enable-ipc = true

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
label-mode-padding = 2
label-mode-foreground = ${colors.background}
label-mode-background = ${colors.primary}

label-focused = %index%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-padding = 2

label-visible = %index%
label-visible-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d
time = %H:%M
label = %date%  %time%

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage%%

[module/memory]
type = internal/memory
interval = 2
label = RAM %percentage_used%%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
label-charging = %percentage%% (charging)
label-discharging = %percentage%%
label-full = Full

[settings]
screenchange-reload = true
