[window]
opacity = 0.8
padding = { x = 8, y = 8 }
decorations = "none"

[font]
size = 11.0

[font.normal]
family = "Hack"
style = "Regular"

[font.bold]
family = "DejaVu Sans Mono"
style = "Bold"

[colors.primary]
background = "#1a1a1a"
foreground = "#e0e0e0"

[colors.cursor]
text = "#1a1a1a"
cursor = "#ffffff"

[colors.normal]
black   = "#1a1a1a"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"
white   = "#e0e0e0"

[colors.bright]
black   = "#5c6370"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"
white   = "#ffffff"

[scrolling]
history = 5000

[cursor]
style = { shape = "Block", blinking = "Off" }

[terminal]
osc52 = "CopyPaste"
