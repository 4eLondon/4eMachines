[colors]
background = #1a1a1a
foreground = #e0e0e0
primary = #61afef
alert = #e06c75

[bar/main]
width = 100%
height = 24
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = DejaVu Sans Mono:size=10
modules-left = bspwm
modules-center = date
modules-right = memory network

[module/bspwm]
type = internal/bspwm
label-focused = %index%
label-focused-background = ${colors.primary}
label-focused-padding = 2
label-occupied = %index%
label-occupied-padding = 2
label-empty = %index%
label-empty-foreground = #5c6370
label-empty-padding = 2

[module/date]
type = internal/date
interval = 5
date = %Y-%m-%d
time = %H:%M
label = %date% %time%

[module/memory]
type = internal/memory
interval = 3
label = M: %percentage_used%%

[module/network]
type = internal/network
interface = ens3
interval = 5
label-connected = "NET: %local_ip%"
label-disconnected = "NET: down"
